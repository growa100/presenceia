<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EFE8"/>
      <stop offset="1" stop-color="#FBE7E4"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A1A24" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="40" fill="url(#bg2)"/>

  <text x="100" y="92" font-size="15" fill="#8A8A95" letter-spacing="2">EMAIL · SAMEDI 19 SEPTEMBRE 2026</text>

  <!-- Antoine -->
  <g filter="url(#sh)">
    <rect x="100" y="120" width="720" height="150" rx="28" fill="#FFFFFF"/>
  </g>
  <circle cx="150" cy="170" r="22" fill="#E8372A"/>
  <text x="150" y="176" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">AP</text>
  <text x="190" y="163" font-size="15" font-weight="700" fill="#17171C">Antoine</text>
  <text x="270" y="163" font-size="14" fill="#A5A3AE">11:18</text>
  <text font-size="20" fill="#2B2B33">
    <tspan x="190" y="200">Avant de me lancer dans l'analyse, est-ce que je pourrais</tspan>
    <tspan x="190" y="230">vous demander comment vous avez obtenu mon email ?</tspan>
  </text>

  <!-- Client -->
  <g filter="url(#sh)">
    <rect x="380" y="300" width="720" height="150" rx="28" fill="#17171C"/>
  </g>
  <circle cx="430" cy="350" r="22" fill="#FFFFFF"/>
  <text x="430" y="356" font-size="15" font-weight="700" fill="#17171C" text-anchor="middle">J</text>
  <text x="470" y="343" font-size="15" font-weight="700" fill="#FFFFFF">Julien</text>
  <text x="528" y="343" font-size="14" fill="#8A8A95">19:00</text>
  <text font-size="20" fill="#F5F3EE">
    <tspan x="470" y="380">Avec plaisir ! En fait j'ai cherché via </tspan><tspan font-weight="700" fill="#FF7A6E">ChatGPT</tspan><tspan>,</tspan>
    <tspan x="470" y="410">et il m'a recommandé vos services.</tspan>
  </text>

  <text x="100" y="516" font-size="14" fill="#A5A3AE">Prénom modifié. Aucun contenu publié, aucune publicité : un site clair et une fiche à jour.</text>
</svg>
