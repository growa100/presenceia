<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1EA"/>
      <stop offset="1" stop-color="#E9E2F3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8372A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8372A" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1A1A24" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="40" fill="url(#bg)"/>
  <circle cx="1020" cy="140" r="260" fill="url(#glow)"/>

  <!-- device card -->
  <g filter="url(#shadow)">
    <rect x="150" y="60" width="900" height="700" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- top bar -->
  <text x="200" y="118" font-size="15" fill="#8A8A95" letter-spacing="2">CHATGPT · CONVERSATION D'UN CLIENT · 19 SEPTEMBRE 2026</text>
  <line x1="200" y1="136" x2="1000" y2="136" stroke="#EEEAF2"/>

  <!-- user bubble -->
  <rect x="360" y="166" width="640" height="112" rx="26" fill="#E9F1FB"/>
  <text font-size="19" fill="#1B3A63">
    <tspan x="388" y="204">Trouve-moi un conseiller en investissement qui fait autant</tspan>
    <tspan x="388" y="232">de l'hypothèque que de la crypto que l'investissement</tspan>
    <tspan x="388" y="260">en bourse que de l'immobilier</tspan>
  </text>

  <!-- assistant intro -->
  <text font-size="19" fill="#2B2B33">
    <tspan x="200" y="330">Oui. J'ai cherché un profil capable de regarder </tspan><tspan font-weight="700">ton patrimoine dans son ensemble</tspan><tspan> :</tspan>
    <tspan x="200" y="358">immobilier de rendement, financement hypothécaire, actions et ETF, crypto.</tspan>
  </text>

  <!-- anonymised entries -->
  <g fill="#B9B7C2" font-size="19">
    <circle cx="214" cy="412" r="4" fill="#C9C7D1"/>
    <text x="234" y="418" font-weight="700">Conseiller indépendant, Lausanne (VD)</text>
    <text x="234" y="446">Financement immobilier, hypothèques, actions, ETF…</text>
    <circle cx="214" cy="494" r="4" fill="#C9C7D1"/>
    <text x="234" y="500" font-weight="700">Cabinet de gestion, Genève (GE)</text>
    <text x="234" y="528">Placements, fiscalité, patrimoine et prévoyance…</text>
  </g>

  <!-- highlighted entry -->
  <rect x="184" y="556" width="832" height="166" rx="22" fill="#FFF6F5" stroke="#E8372A" stroke-width="2"/>
  <circle cx="214" cy="596" r="4" fill="#E8372A"/>
  <text x="234" y="602" font-size="21" font-weight="700" fill="#17171C">Antoine Pury, 41 Advisory</text>
  <text x="234" y="627" font-size="17" fill="#6B6B78">Zoug (ZG)</text>
  <text font-size="18" fill="#2B2B33">
    <tspan x="234" y="658">Conseiller en investissement indépendant « fee-only », payé par le client,</tspan>
    <tspan x="234" y="683">sans rétrocessions. Particulièrement pertinent pour</tspan>
    <tspan x="234" y="708" font-weight="700">actions + ETF + crypto/digital assets.</tspan>
  </text>
  <rect x="856" y="576" width="140" height="30" rx="15" fill="#EEEAF2"/>
  <text x="926" y="596" font-size="14" fill="#6B6B78" text-anchor="middle">41advisory.ch</text>

  <!-- footer note -->
  <text x="200" y="748" font-size="14" fill="#A5A3AE">Réponse reproduite d'après la capture d'écran du client. Les autres cabinets sont anonymisés.</text>
</svg>
